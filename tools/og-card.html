<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0d1017;color:#f3f5fa;font-family:-apple-system,'SF Pro Display','Geist',sans-serif;position:relative}
.b{position:absolute;border-radius:50%;width:900px;height:900px}
.b1{left:420px;top:-380px;background:radial-gradient(circle,rgba(245,150,40,.40),transparent 62%)}
.b2{left:-320px;top:-120px;background:radial-gradient(circle,rgba(110,90,230,.45),transparent 62%)}
.b3{left:160px;top:240px;background:radial-gradient(circle,rgba(40,170,190,.30),transparent 62%)}
.wrap{position:relative;display:grid;grid-template-columns:1fr 470px;gap:56px;padding:64px 64px;height:100%;box-sizing:border-box}
.k{font:600 18px/1 inherit;display:flex;align-items:center;gap:12px;color:#d6dbe8}
.k svg{width:30px;height:30px;color:#f5a13c;filter:drop-shadow(0 0 10px rgba(245,161,60,.6))}
h1{font-weight:700;font-size:112px;line-height:.9;letter-spacing:-.055em;margin:44px 0 28px}
h1 span{color:#f5a13c;text-shadow:0 0 60px rgba(245,161,60,.5)}
p{font-size:25px;line-height:1.4;color:#b9c0d2;margin:0;max-width:22ch}
.pill{position:absolute;left:64px;bottom:58px;display:flex;align-items:center;gap:14px;padding:16px 16px 16px 26px;border-radius:99px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);font:500 22px 'Geist Mono',monospace;width:520px;box-sizing:border-box}
.pill b{margin-left:auto;font:600 19px -apple-system,'Geist',sans-serif;color:#2a1a08;background:linear-gradient(#ffc070,#f5a13c);padding:14px 26px;border-radius:99px}
.glass{border-radius:30px;padding:12px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 30px 80px -30px rgba(0,0,0,.8);align-self:center}
.map{width:444px;height:444px;border-radius:20px;background:rgba(13,16,23,.6) url(../dist/map.png) center/cover;image-rendering:pixelated;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
</style></head><body><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i>
<div class="wrap"><div><div class="k"><svg viewBox="0 0 16 16"><path d="M2.5 13.5v-3h3v3h5v-3h3v3M13.5 7.5v-5h-3v3h-5v-3h-3v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>AWS IP Atlas</div>
<h1>Is this IP <span>AWS?</span></h1>
<p>Instant lookup across every AWS public IP range, live.</p>
<div class="pill">18.180.88.10<b>Check</b></div></div>
<div class="glass"><div class="map"></div></div></div>
</body></html>
