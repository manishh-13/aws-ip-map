<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{color:#eef3f9;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;letter-spacing:-.01em;
background:radial-gradient(700px 500px at 88% 0%,rgba(255,153,0,.24),transparent 70%),radial-gradient(800px 600px at 5% 15%,rgba(80,120,255,.32),transparent 70%),#0e1726}
.wrap{display:grid;grid-template-columns:1fr 470px;gap:40px;padding:60px 64px;height:100%;box-sizing:border-box;align-items:center;perspective:1400px}
.k{font-weight:600;font-size:20px;display:flex;align-items:center;gap:10px;color:#c3cedc}
.k svg{width:28px;height:28px;color:#ff9900}
h1{font-weight:700;font-size:76px;line-height:1;letter-spacing:-.045em;margin:30px 0 22px}
p{font-size:24px;line-height:1.4;color:#c3cedc;margin:0 0 34px;max-width:28ch}
.pill{display:flex;align-items:center;gap:14px;padding:8px 8px 8px 26px;border-radius:999px;width:500px;box-sizing:border-box;font:500 23px ui-monospace,'SF Mono',monospace;
background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1)}
.pill b{margin-left:auto;font:600 20px -apple-system,sans-serif;color:#1a1205;background:linear-gradient(180deg,#ffb340,#ff9900);padding:16px 26px;border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.slab{padding:11px;border-radius:30px;transform:rotateX(6deg) rotateY(-12deg);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1),9px 6px 0 -1px rgba(158,216,255,.16),16px 11px 0 -2px rgba(158,216,255,.08),30px 40px 60px -20px rgba(2,6,16,.8)}
.map{width:440px;height:440px;border-radius:21px;background:rgba(10,18,31,.75) url(../dist/map.png) center/cover;image-rendering:pixelated;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
</style></head><body>
<div class="wrap"><div><div class="k"><svg viewBox="0 0 16 16"><path d="M2.5 13.5v-3h3v3h5v-3h3v3M13.5 7.5v-5h-3v3h-5v-3h-3v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>AWS IP Atlas</div>
<h1>AWS IP address ranges, made easy to look up.</h1>
<p>Search every AWS public IP range by IP, CIDR, region or service.</p>
<div class="pill">18.180.88.10<b>Look up</b></div></div>
<div class="slab"><div class="map"></div></div></div>
</body></html>
