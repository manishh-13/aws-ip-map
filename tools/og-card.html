<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@500;700&family=Atkinson+Hyperlegible+Mono:wght@500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#1d1b19;color:#f1ede6;font-family:'Atkinson Hyperlegible Next',sans-serif;position:relative}
.b{position:absolute;border-radius:50%;width:900px;height:900px}
.b1{left:420px;top:-380px;background:radial-gradient(circle,rgba(245,150,40,.40),transparent 62%)}
.b2{left:-320px;top:-120px;background:radial-gradient(circle,rgba(110,90,230,.45),transparent 62%)}
.b3{left:160px;top:240px;background:radial-gradient(circle,rgba(40,170,190,.30),transparent 62%)}
.wrap{position:relative;display:grid;grid-template-columns:1fr 470px;gap:56px;padding:64px 64px;height:100%;box-sizing:border-box}
.k{font:600 18px/1 inherit;display:flex;align-items:center;gap:12px;color:#d6dbe8}
.k svg{width:30px;height:30px;color:#ee8a3c}
h1{font-weight:700;font-size:104px;line-height:.98;letter-spacing:-.035em;margin:44px 0 28px}
h1 span{color:#ee8a3c}
p{font-size:25px;line-height:1.4;color:#bdb6ab;margin:0;max-width:22ch}
.pill{position:absolute;left:64px;bottom:58px;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 24px;border-radius:16px;background:#141311;box-shadow:inset 0 1px 3px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.14);font:500 24px 'Atkinson Hyperlegible Mono',monospace;width:520px;box-sizing:border-box}
.pill b{margin-left:auto;font:700 20px 'Atkinson Hyperlegible Next',sans-serif;color:#2a1a08;background:#ee8a3c;padding:16px 26px;border-radius:10px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.glass{align-self:center}
.map{width:470px;height:470px;border-radius:16px;background:#1e1d1b url(../dist/map.png) center/cover;image-rendering:pixelated;box-shadow:0 0 0 1px rgba(255,255,255,.16)}
</style></head><body>
<div class="wrap"><div><div class="k"><svg viewBox="0 0 16 16"><path d="M2.5 13.5v-3h3v3h5v-3h3v3M13.5 7.5v-5h-3v3h-5v-3h-3v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>AWS IP Atlas</div>

<p>Instant lookup across every AWS public IP range, live.</p>
<div class="pill">18.180.88.10<b>Check</b></div></div>
<div class="glass"><div class="map"></div></div></div>
</body></html>
